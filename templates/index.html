<link rel="stylesheet" href="/static/style.css">

<div class="container">
<h2>Add Account</h2>
<form method="post" action="/add_account">
    <input name="name" placeholder="Account Name">
    <input name="type" placeholder="Income / Expense">
    <button>Add Account</button>
</form>

<h2>Add Transaction</h2>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post" action="/add_transaction">
    <input name="account_id" placeholder="Account ID">
    <input name="amount" placeholder="Amount">
    <input name="desc" placeholder="Description">
    <button>Add Transaction</button>
</form>

<a href="/report">View Financial Report</a>
</div>
<h2>Accounts</h2>
<table>
<tr><th>ID</th><th>Name</th><th>Type</th><th>Delete</th></tr>

{% for a in accounts %}
<tr>
<td>{{a.account_id}}</td>
<td>{{a.account_name}}</td>
<td>{{a.type}}</td>
<td>
<form action="/delete_account/{{a.account_id}}" method="post">
<button style="background:red">Delete</button>
</form>
</td>
</tr>
{% endfor %}
</table>
<a href="/accounts">Manage Accounts</a>

<a href="/budget">Budget Planning</a>
